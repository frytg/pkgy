; PlatformIO project configuration for the M5Stack CoreInk ESP32 e-ink display
; Docs: https://docs.m5stack.com/en/core/CoreInk
; Flash via USB-C. Board: ESP32-PICO-D4, 200x200 1-bit e-ink (IT8951).

[env:m5stack-coreink]
platform = espressif32
board = m5stack-coreink
framework = arduino
monitor_speed = 115200
upload_speed = 1500000

lib_deps =
	# M5Unified is the modern M5Stack library and supports the CoreInk's
	# IT8951 200x200 e-ink via M5.Display + LGFX_Sprite. The older
	# M5CoreInk-only library isn't published on the PlatformIO registry.
	m5stack/M5Unified@^0.2.0
	bblanchon/ArduinoJson@^7.0.4
	# Sandeep Mistry's HttpClient — uses WiFiClient directly and avoids
	# the HTTPClient _tcp->connected() null-deref in this ESP32 Arduino
	# core. Same API shape as HTTPClient but with beginRequest/endRequest
	# instead of begin/GET.
	arduino-libraries/ArduinoHttpClient@^0.6.1

build_flags =
	# The CoreInk uses the original ESP32-PICO-D4 with an external
	# USB-serial bridge (CH9102), so Serial is always available on UART0.
	# Do NOT set ARDUINO_USB_CDC_ON_BOOT=1 here — that's only for
	# ESP32-S2/S3 native-USB boards and breaks the M5Unified build.
