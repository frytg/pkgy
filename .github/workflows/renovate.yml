name: Renovate

# Self-hosted Renovate (no Mend GitHub App). Repo config lives in renovate.json5
# so the same rules can run on another platform (GitLab runner, cron + Docker, etc.).
# Requires repository secret RENOVATE_TOKEN — a classic PAT (repo + workflow scopes).
# https://docs.renovatebot.com/getting-started/running/
# https://github.com/renovatebot/github-action

on:
  schedule:
    # Every other day at 05:00 UTC ≈ before 9am Europe/Berlin (CET/CEST)
    - cron: '0 5 */2 * *'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run (log only, no PRs/issues)'
        type: boolean
        default: false
      logLevel:
        description: 'Renovate log level'
        type: choice
        options:
          - info
          - debug
        default: info

concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: write
      statuses: write
      issues: write
      pull-requests: write
    steps:
      - name: 👀 Checkout repository
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: 🤖 Self-hosted Renovate
        uses: renovatebot/github-action@v46.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Config is committed; skip onboarding PR.
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          # String "null" is parsed as JSON null (disabled). "full" = log-only.
          RENOVATE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dryRun == true && 'full' || 'null' }}
          RENOVATE_REPOSITORY_CACHE: enabled
