# reTerminal E1001 — e-ink monitor (B&W)
#
# Pulls an 800×480 1-bit PNG from your backend and paints full-screen.
# Device does no layout: OpenRouter + Cursor + activity maps render on the server.
#
# Expected endpoint on frame_base_url:
#   GET /ext-api/e-ink-monitor/frame.png  — always a fresh screenshot (~5–8s)
#
# Cadence:
#   deep sleep 20min  →  wake  →  GET frame.png  →  refresh panel  →  sleep
#   green button   →  wake  →  GET frame.png  →  sleep
#
# Sleep model (important):
#   Do NOT deep_sleep.enter from on_download_finished right after component.update.
#   epaper refresh is slow/async; entering sleep mid-refresh blanks the cycle.
#   Pattern: on_download only paints; wait panel_refresh_wait; then sleep.
#   run_duration is the deadman if that path never completes.
#
# Fill secrets.yaml first. Set frame_base_url. Flash with: just run

substitutions:
  device_name: reterminal-monitor
  friendly_name: E-ink Monitor
  # backend origin the device can reach (LAN/VPN). no trailing slash.
  frame_base_url: "http://10.0.17.17:8080"
  # how long to stay awake after boot (download ~8s + panel refresh headroom)
  run_duration: "90s"
  # how long to sleep between automatic wakes (usage dashboards want fresher pulls)
  sleep_duration: "20min"
  # wait after kicking the panel before an explicit sleep enter (B&W is faster than Spectra)
  panel_refresh_wait: "20s"
  ap_password: "einkmonitor"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2025.10.0
  on_boot:
    - priority: 600
      then:
        - output.turn_on: bsp_battery_enable
        - delay: 200ms

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
  flash_size: 16MB
  variant: esp32s3

# frame buffer + PNG decode need PSRAM
psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: UART0
  level: INFO
  logs:
    # component levels must be >= global level severity
    online_image: INFO
    http_request: INFO
    waveshare_epaper: INFO

# Optional Home Assistant — uncomment if used
# api:
#   encryption:
#     key: !secret api_key

# ota:
#   - platform: esphome
#     password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  fast_connect: true
  on_connect:
    - logger.log: "wifi up — pulling monitor frame"
    # pull after Wi‑Fi is actually up (on_boot is too early / races join)
    - script.execute: pull_frame
  on_disconnect:
    - logger.log: "wifi down"
  ap:
    ssid: "${device_name}-ap"
    password: ${ap_password}

captive_portal:

# -----------------------------------------------------------------------------
# Power / sleep
# -----------------------------------------------------------------------------

output:
  # VBAT enable — GPIO21 per Seeed BSP / community configs (GPIO6 is status LED)
  - platform: gpio
    pin: GPIO21
    id: bsp_battery_enable

sensor:
  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    id: battery_voltage
    attenuation: 12db
    update_interval: 60s
    filters:
      - multiply: 2.0

# Green refresh button — also deep-sleep wake (INVERT_WAKEUP, active low)
binary_sensor:
  - platform: gpio
    id: btn_refresh
    name: "Refresh Button"
    pin:
      number: GPIO3
      allow_other_uses: true
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      then:
        - logger.log: "button: refresh monitor"
        - script.execute: pull_frame

button:
  - platform: template
    name: "Refresh Frame"
    icon: mdi:monitor-dashboard
    on_press:
      - script.execute: pull_frame

deep_sleep:
  id: deep_sleep_1
  # deadman: auto-sleep even if the post-refresh script never runs
  run_duration: ${run_duration}
  sleep_duration: ${sleep_duration}
  wakeup_pin:
    number: GPIO3
    allow_other_uses: true
    mode:
      input: true
      pullup: true
  wakeup_pin_mode: INVERT_WAKEUP

# -----------------------------------------------------------------------------
# Display path: HTTP PNG → paint → sleep
# -----------------------------------------------------------------------------

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

http_request:
  useragent: "reterminal-e1001-monitor/0.1"
  timeout: 90s
  # backend always renders (~5–8s typical); leave headroom for cold gowitness
  watchdog_timeout: 120s
  verify_ssl: false

image:
  - platform: online_image
    id: monitor_frame
    format: PNG
    # monochrome panel — server already dumps 1-bit; BINARY keeps RAM small
    type: BINARY
    resize: 800x480
    buffer_size: 65536
    url: "${frame_base_url}/ext-api/e-ink-monitor/frame.png"
    update_interval: never
    on_download_finished:
      then:
        - logger.log: "frame downloaded — refreshing panel"
        - script.execute: show_and_sleep
    on_error:
      then:
        - logger.log:
            level: ERROR
            format: "frame download failed — sleeping shortly"
        - delay: 15s
        - deep_sleep.enter: deep_sleep_1

display:
  # ESPHome has no Seeed-reTerminal-E1001 board model — E1001 mono uses waveshare_epaper
  # per Seeed wiki (same pins as E1002 board; busy inverted).
  # Fallback if hatchy: model 7.50inv2alt
  - platform: waveshare_epaper
    id: epaper_display
    model: 7.50inv2
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin:
      number: GPIO12
      inverted: false
    busy_pin:
      number: GPIO13
      inverted: true
    update_interval: never
    lambda: |-
      // Binary epaper: COLOR_ON ≈ black ink, COLOR_OFF ≈ white paper.
      // BINARY decode of a black-on-white PNG often has ON bits on the light
      // areas — map ON→white, OFF→black so we get black text on white.
      it.fill(COLOR_OFF);
      it.image(0, 0, id(monitor_frame), COLOR_OFF, COLOR_ON);

# -----------------------------------------------------------------------------
# Scripts
# -----------------------------------------------------------------------------

script:
  # set_url auto-triggers download (update defaults to true)
  - id: pull_frame
    mode: restart
    then:
      - logger.log: "pull monitor frame (always fresh on server)"
      - online_image.set_url:
          id: monitor_frame
          url: "${frame_base_url}/ext-api/e-ink-monitor/frame.png"

  # Kick panel, then wait for refresh before sleep.
  # mode: single prevents double-enter if download fires twice.
  - id: show_and_sleep
    mode: single
    then:
      - component.update: epaper_display
      - logger.log: "panel update kicked — waiting for refresh"
      - delay: ${panel_refresh_wait}
      - logger.log: "entering deep sleep"
      - deep_sleep.enter: deep_sleep_1
